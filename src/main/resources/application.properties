spring.application.name=ticket-logger
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ticket_logger?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:myuser}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.messages.encoding=UTF-8